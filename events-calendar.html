<body x-data="dsgApp('calendar')" class="page-events">
  <header class="site-header"><nav class="nav"><a class="brand" href="index.html"><img src="assets/optimized/logo_full.webp" alt="DSG"></a><div class="nav-links"><a href="index.html">首页</a><div class="nav-item"><a class="active" href="events.html?v=20261119s">活动</a><div class="dropdown"><a href="events-calendar.html">活动日历</a><a href="events-summits.html">年度峰会</a><a href="events-city.html">城市沙龙</a><a href="events-elite-talks.html">精英六人谈</a></div></div><a href="supply-chain-ai.html">供应链AI创新专区</a><a href="insights.html">行业洞察</a><a href="about.html">关于 DSG</a><a href="contact.html">联系我们</a></div><button class="nav-burger" type="button" aria-label="展开菜单" aria-expanded="false"><span></span><span></span><span></span></button><a class="nav-cta" href="contact.html">预约咨询</a><a class="lang-toggle" href="events-calendar-en.html">EN</a></nav></header>
  <main>
    <section class="section surface-dark ev-hero">
      <div class="container split">
        <div><span class="eyebrow" data-bind="events-calendar.s1.eye">Calendar</span>
          <h1>一年 12 格，<br>看清 DSG 的排期。</h1>
          <p class="muted" data-bind="events-calendar.s1.p">按年份切换，一个月一格。格子里是这个月的场次与类型；点开可看每场的日期、主题、行业与地点，再进单场详情。</p>
        </div>
        <div class="media-frame"><img src="assets/optimized/module-calendar-v2.webp" alt="活动日历"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- 11-06 评审：日历改为按年 12 格，可切年份；点月份弹当月活动与月度海报 -->
        <div class="caly-bar">
          <div class="caly-years">
            <template x-for="y in calendarYears" :key="y">
              <button :class="{on: y === calendarYear}" @click="calendarYear = y" x-text="y + ' 年'"></button>
            </template>
          </div>
          <p class="meta" data-bind="events-calendar.s2.p">点开月份查看当月每场活动</p>
        </div>

        <div class="caly-grid">
          <template x-for="m in monthsGrid" :key="m.key">
            <button class="caly-m" :class="{empty: !m.count}" @click="m.count && openMonth(m.key)">
              <div class="m-top">
                <span class="m-name" x-text="m.month + ' 月'"></span>
                <span class="m-count" x-text="m.count ? m.count + ' 场' : '—'"></span>
              </div>
              <div class="m-lead" x-text="m.count ? m.lead : '本月无公开场次'"></div>
              <div class="m-cats">
                <template x-for="c in m.cats" :key="c"><i :class="c"></i></template>
              </div>
            </button>
          </template>
        </div>
      </div>
    </section>

    <div class="caly-pop" x-cloak x-show="activeMonth" x-transition @click.self="closeMonth()">
      <div class="caly-panel">
        <div class="p-head">
          <div><div class="meta">当月活动</div><h3 x-text="activeMonthLabel"></h3></div>
          <button class="close" @click="closeMonth()">×</button>
        </div>
        <div class="caly-pop-list">
          <template x-for="e in activeMonthEvents" :key="e.id">
            <div class="caly-row">
              <div class="d" x-text="eventDateLabel(e)"></div>
              <div>
                <strong x-html="titleHtml(e.title)"></strong>
                <small x-text="[e.categoryLabel, e.sessionNo ? '第 ' + e.sessionNo + ' 期' : '', e.city, e.audience].filter(Boolean).join(' · ')"></small>
              </div>
              <div class="caly-row-actions">
                <a class="btn secondary" :href="eventDetailUrl(e)" data-bind="events-calendar.s2.a">详情</a>
                <button type="button" class="btn gold" @click="openRegistration(e)" x-text="eventPhaseLabel(e) === '已结束' ? '预约同类' : '报名'"></button>
              </div>
            </div>
          </template>
        </div>
        <div class="caly-poster" x-show="activeMonthEvents.length">
          <div>
            <h4 style="margin:0 0 8px" data-bind="events-calendar.s2.h4">本月看点</h4>
            <p class="meta" x-text="activeMonthEvents.map(function (e) { return e.categoryLabel + '｜' + e.title; }).join('　/　')"></p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="footer-inner"><div>DSG 活动日历</div><div><a href="events.html?v=20261119s">活动中心</a><a href="partners.html">合作伙伴</a></div><div class="footer-legal">© 2026 数创时代 DSG 保留所有权利 · <a href="privacy.html">隐私条款</a>

     <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备XXXXXXXX号</a> -->
</div>
  </div></footer>
  <div class="modal" x-cloak x-show="selectedEvent"><div class="modal-panel"><div class="modal-head"><div><div class="meta" x-text="selectedEvent && selectedEvent.city + ' · ' + selectedEvent.time"></div><h2 x-text="selectedEvent && selectedEvent.title"></h2></div><button class="close" @click="closeRegistration()">×</button></div><form class="form-grid lead-form" novalidate @submit.prevent="submitRegistration($event)" @focusin.once="$el.elements.formStartedAt.value = Date.now()">
        <input type="hidden" name="formStartedAt" value="">
        <div class="hp" aria-hidden="true"><label>website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <div class="field"><input name="name" placeholder="姓名" autocomplete="name" required><template x-if="formState.errors.name"><p class="field-error" x-text="formState.errors.name"></p></template></div>
        <div class="field"><input name="company" placeholder="公司" autocomplete="organization" required><template x-if="formState.errors.company"><p class="field-error" x-text="formState.errors.company"></p></template></div>
        <div class="field"><input name="jobTitle" placeholder="职位" autocomplete="organization-title"></div>
        <div class="field"><input name="phone" placeholder="手机" inputmode="tel" autocomplete="tel" required><template x-if="formState.errors.phone"><p class="field-error" x-text="formState.errors.phone"></p></template></div>
        <div class="field full"><input name="email" type="email" placeholder="邮箱" autocomplete="email" required><template x-if="formState.errors.email"><p class="field-error" x-text="formState.errors.email"></p></template></div>
        <div class="field full"><select name="interest"><option>我希望报名参会</option><option>我想报名参会</option><option>我想申请私董会席位</option><option>我想预约供应链 AI Demo</option><option>我想了解商务合作</option><option>我想了解后续场次</option></select></div>
        <div class="field full"><textarea name="message" placeholder="希望交流的问题"></textarea></div>
        <div class="field full form-consent">
          <label><input type="checkbox" name="consent"> 我已阅读并同意 <a href="privacy.html" target="_blank" rel="noopener">DSG 隐私条款</a>，同意 DSG 按条款处理我的信息（条款版本 <span x-text="DSGForms ? DSGForms.policyVersion : ''"></span>）</label>
          <template x-if="formState.errors.consent"><p class="field-error" x-text="formState.errors.consent"></p></template>
        </div>
        <button class="btn gold full" type="submit" :disabled="formState.submitting" x-text="formState.submitting ? '提交中…' : '提交'"></button>
        <p class="form-message full" x-show="formState.message" x-text="formState.message"></p>
      </form></div></div>
<script src="assets/dsg-sync.js?v=20260917-eventsync"></script>
