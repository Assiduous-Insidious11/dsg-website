<body x-data="dsgApp('detail')" class="page-events">
  <header class="site-header"><nav class="nav"><a class="brand" href="index.html"><img src="assets/optimized/logo_full.webp" alt="DSG"></a><div class="nav-links"><a href="index.html">首页</a><div class="nav-item"><a class="active" href="events.html?v=20261119s">活动</a><div class="dropdown"><a href="events-calendar.html">活动日历</a><a href="events-summits.html">年度峰会</a><a href="events-city.html">城市沙龙</a><a href="events-elite-talks.html">精英六人谈</a></div></div><a href="supply-chain-ai.html">供应链AI创新专区</a><a href="insights.html">行业洞察</a><a href="about.html">关于 DSG</a><a href="contact.html">联系我们</a></div><button class="nav-burger" type="button" aria-label="展开菜单" aria-expanded="false"><span></span><span></span><span></span></button><a class="nav-cta" href="contact.html">预约咨询</a><a class="lang-toggle" href="event-detail-en.html">EN</a></nav></header>

  <main>
    <section class="program-hero">
      <div class="container">
        <div>
          <a class="dt-back" href="events.html">← 返回活动中心</a>
          <span class="eyebrow"><span x-text="currentEvent.categoryLabel || currentEvent.eyebrow"></span><template x-if="currentEvent.sessionNo"><span x-text="' · 第 ' + currentEvent.sessionNo + ' 期'"></span></template></span>
          <h1 x-html="titleHtml(currentEvent.title)"></h1>
          <!-- 11-06 评审：主题口号、参会人员、活动形式分三类信息，必须分行并加冒号 -->
          <div class="dt-rows" style="margin-top:20px">
            <template x-for="r in infoRows(currentEvent)" :key="r.k">
              <div class="row"><span class="k" x-text="r.k"></span><span class="v" x-text="r.v"></span></div>
            </template>
            <div class="row" x-show="!infoRows(currentEvent).length"><span class="k">主题</span><span class="v" x-text="summaryText(currentEvent)"></span></div>
          </div>
          <div class="dt-hero-facts">
            <template x-for="n in keyNumbers(currentEvent)" :key="n.k">
              <div class="f"><strong x-text="n.v"></strong><span x-text="n.k"></span></div>
            </template>
          </div>
        </div>
        <div class="program-visual">
          <template x-if="hasMedia(currentEvent)"><img :src="currentEvent.image" :alt="currentEvent.title"></template>
          <template x-if="!hasMedia(currentEvent)">
            <div class="kvx" :class="currentEvent.kvStyle" style="min-height:340px">
              <div class="kv-top"><span class="kv-type" x-text="currentEvent.categoryLabel"></span><span class="kv-no" x-text="currentEvent.sessionNo ? '第 ' + currentEvent.sessionNo + ' 期' : ''"></span></div>
              <div>
                <div class="kv-title" x-text="kvTitle(currentEvent)"></div>
                <div class="kv-meta"><span x-text="eventDateLabel(currentEvent) + ' · ' + (currentEvent.city || '')"></span></div>
                
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <section class="section compact">
      <div class="container detail-overview">
        <div class="detail-main">
          <!-- 01 议程：真实流程，不用「围绕主题展开分享」这类占位句 -->
          <div class="dt-band">
            <div class="lab">Agenda</div>
            <div>
              <h2 data-bind="event-detail.s2.h2">活动议程</h2>
              <div class="dt-agenda">
                <template x-for="(a, i) in agendaRows(currentEvent)" :key="i">
                  <div class="row">
                    <span class="t" x-text="a.time || ''"></span>
                    <span class="n" x-text="String(i + 1).padStart(2, '0')"></span>
                    <span class="x" x-text="a.text"></span>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- 02 适用人群与交流价值：适用人群放大字号（评审点名字号过小），下面是真实交流话题 -->
          <div class="dt-band">
            <div class="lab">Audience</div>
            <div>
              <h2 x-text="audienceText(currentEvent) ? '适用人群与交流价值' : '交流话题'">适用人群与交流价值</h2>
              <div class="dt-rows">
                <div class="row" x-show="audienceText(currentEvent)"><span class="k" data-bind="event-detail.s2.span">适用人群</span><span class="v" style="font-size:18px;line-height:1.8" x-text="audienceText(currentEvent)"></span></div>
              </div>
              <div class="dt-topic" x-show="topicsOf(currentEvent).length" style="margin-top:22px">
                <template x-for="(t, i) in topicsOf(currentEvent)" :key="i">
                  <div class="t-item">
                    <div class="t-title" x-text="t.title"></div>
                    <div class="t-supp" x-show="t.supplement" x-text="t.supplement"></div>
                  </div>
                </template>
              </div>
              <div class="tag-row" style="margin-top:18px"><template x-for="tag in currentEvent.tags" :key="tag"><span class="tag" x-text="tag"></span></template></div>
            </div>
          </div>

          <!-- 03 分享嘉宾 / 参会名单：姓名 + 公司 + 职位；无授权头像时用首字头像，不放假人像 -->
          <div class="dt-band" x-show="currentEventSpeakers.length || attendeesOf(currentEvent).length">
            <div class="lab">Speakers</div>
            <div>
              <h2 x-text="currentEventSpeakers.length ? '分享嘉宾' : '参会嘉宾名单'"></h2>
              <div class="dt-speakers" x-show="currentEventSpeakers.length">
                <template x-for="speaker in currentEventSpeakers" :key="speaker.id">
                  <article class="dt-speaker">
                    <template x-if="speakerPortrait(speaker)"><img :src="speakerPortrait(speaker)" :alt="speakerDisplayName(speaker)"></template>
                    <span class="avx lg" x-show="!speakerPortrait(speaker)" :class="avatarTone(speakerDisplayName(speaker))" x-text="initialOf(speakerDisplayName(speaker))"></span>
                    <div>
                      <strong x-text="speakerDisplayName(speaker)"></strong>
                      <span x-text="[speaker.jobTitle, speaker.company].filter(Boolean).join(' · ')"></span>
                    </div>
                  </article>
                </template>
              </div>
              <div class="dt-speakers" x-show="!currentEventSpeakers.length && attendeesOf(currentEvent).length">
                <template x-for="p in attendeesOf(currentEvent)" :key="p.org + p.role">
                  <article class="dt-speaker">
                    <span class="avx lg" :class="avatarTone(p.org)" x-text="initialOf(p.org)"></span>
                    <div>
                      <strong x-text="p.name || p.org"></strong>
                      <span x-text="p.name ? [p.role, p.org].filter(Boolean).join(' · ') : p.role"></span>
                    </div>
                  </article>
                </template>
              </div>
              <p class="meta" style="margin-top:14px" x-show="!currentEventSpeakers.length">名单来自活动签到与邀请记录，按公司与职务排列；未经本人授权不公开个人姓名与照片。</p>
            </div>
          </div>

        </div>

        <aside class="detail-side">
          <h3 data-bind="event-detail.s2.h3">活动信息</h3>
          <dl>
            <div><dt>日期</dt><dd x-text="eventDateLabel(currentEvent)"></dd></div>
            <div x-show="currentEvent.time"><dt>时间</dt><dd x-text="currentEvent.time"></dd></div>
            <div x-show="currentEvent.city"><dt>城市</dt><dd x-text="currentEvent.city"></dd></div>
            <div x-show="currentEvent.venue"><dt>地点</dt><dd x-text="currentEvent.venue"></dd></div>
            <div x-show="scaleText(currentEvent)"><dt>规模</dt><dd x-text="scaleText(currentEvent)"></dd></div>
            <div><dt>类型</dt><dd x-text="currentEvent.categoryLabel || currentEvent.typeLabel || '活动'"></dd></div>
          </dl>
          <div class="actions"><button class="btn gold" @click="openRegistration(currentEvent)" x-text="eventPhaseLabel(currentEvent) === '已结束' ? '预约同类活动' : (currentEvent.type === 'elite' ? '申请席位' : '报名参会')"></button></div>
          <p class="meta" style="margin-top:12px" x-text="eventPhaseLabel(currentEvent) === '已结束' ? '本场已结束；留下联系方式，同类场次开放报名时优先通知。' : '席位有限，提交后由活动团队确认。'"></p>
        </aside>
      </div>
    </section>

    <section class="section surface-white compact" x-show="photoWall(currentEvent).length">
      <div class="container">
        <div class="section-head"><div><span class="eyebrow" data-bind="event-detail.s3.eye">Scene</span><h2 data-bind="event-detail.s3.h2">现场照片</h2></div><p data-bind="event-detail.s3.p">本场活动的现场记录。</p></div>
        <div class="dt-photos">
          <template x-for="p in photoWall(currentEvent)" :key="p"><img :src="p" :alt="currentEvent.title + ' 现场'"></template>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer"><div class="footer-inner"><div>DSG 活动详情</div><div><a href="events.html?v=20261119s">活动中心</a></div><div class="footer-legal">© 2026 数创时代 DSG 保留所有权利 · <a href="privacy.html">隐私条款</a>
<!-- 备案号占位：取得 ICP 备案号后，把下面整行替换为
     <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备XXXXXXXX号</a> -->
</div>
  </div></footer>
  <div class="modal" x-cloak x-show="selectedEvent"><div class="modal-panel"><div class="modal-head"><h2 x-text="selectedEvent && selectedEvent.title"></h2><button class="close" @click="closeRegistration()">×</button></div><form class="form-grid lead-form" novalidate @submit.prevent="submitRegistration($event)" @focusin.once="$el.elements.formStartedAt.value = Date.now()">
        <input type="hidden" name="formStartedAt" value="">
        <div class="hp" aria-hidden="true"><label>website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <div class="field"><input name="name" placeholder="姓名" autocomplete="name" required><template x-if="formState.errors.name"><p class="field-error" x-text="formState.errors.name"></p></template></div>
        <div class="field"><input name="company" placeholder="公司" autocomplete="organization" required><template x-if="formState.errors.company"><p class="field-error" x-text="formState.errors.company"></p></template></div>
        <div class="field"><input name="jobTitle" placeholder="职位" autocomplete="organization-title"></div>
        <div class="field"><input name="phone" placeholder="手机" inputmode="tel" autocomplete="tel" required><template x-if="formState.errors.phone"><p class="field-error" x-text="formState.errors.phone"></p></template></div>
        <div class="field full"><input name="email" type="email" placeholder="邮箱" autocomplete="email" required><template x-if="formState.errors.email"><p class="field-error" x-text="formState.errors.email"></p></template></div>
        <div class="field full"><select name="interest"><option>我想报名参会</option><option>我想申请私董会席位</option><option>我想预约供应链 AI Demo</option><option>我想了解商务合作</option><option>我想了解后续场次</option></select></div>
        <div class="field full"><textarea name="message" placeholder="希望交流的问题"></textarea></div>
        <div class="field full form-consent">
          <label><input type="checkbox" name="consent"> 我已阅读并同意 <a href="privacy.html" target="_blank" rel="noopener">DSG 隐私条款</a>，同意 DSG 按条款处理我的信息（条款版本 <span x-text="DSGForms ? DSGForms.policyVersion : ''"></span>）</label>
          <template x-if="formState.errors.consent"><p class="field-error" x-text="formState.errors.consent"></p></template>
        </div>
        <button class="btn gold full" type="submit" :disabled="formState.submitting" x-text="formState.submitting ? '提交中…' : '提交'"></button>
        <p class="form-message full" x-show="formState.message" x-text="formState.message"></p>
      </form></div></div>
<script src="assets/dsg-sync.js?v=20260917-eventsync"></script>
  <script src="assets/nav-blocks.js?v=20261125a" defer></script>
</body>
</html>
