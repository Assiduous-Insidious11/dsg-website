  <main>
    <section class="program-hero">
      <div class="container">
        <div>
          <a class="dt-back" href="events.html" data-dt-back>← 返回活动中心</a>
          <span class="eyebrow"><span x-text="currentEvent.categoryLabel || currentEvent.eyebrow"></span><template x-if="currentEvent.sessionNo"><span x-text="' · 第 ' + currentEvent.sessionNo + ' 期'"></span></template></span>
          <h1 x-html="titleHtml(currentEvent.title)"></h1>
          <!-- 11-06 评审：主题口号、参会人员、活动形式分三类信息，必须分行并加冒号 -->
          <div class="dt-rows" style="margin-top:20px">
            <template x-for="r in infoRows(currentEvent)" :key="r.k">
              <div class="row"><span class="k" x-text="r.k"></span><span class="v" x-text="r.v"></span></div>
            </template>
            <div class="row" x-show="!infoRows(currentEvent).length"><span class="k">主题</span><span class="v" x-text="summaryText(currentEvent)"></span></div>
          </div>
          <div class="dt-hero-facts">
            <template x-for="n in keyNumbers(currentEvent)" :key="n.k">
              <div class="f"><strong x-text="n.v"></strong><span x-text="n.k"></span></div>
            </template>
          </div>
        </div>
        <div class="program-visual dt-hero-visual">
          <!-- 2026-11-25：首屏主视觉改用该场活动的正式海报（案例集锦里那张），
               不再用现场照——现场照带场地灯光、摄像机和侧屏，裁不干净。 -->
          <!-- 有裁好的横版/方版 KV 就用它；没有则退回整张海报 -->
          <template x-if="kvOf(currentEvent)">
            <img class="dt-hero-kv" :src="kvOf(currentEvent)" :alt="currentEvent.title + ' 主视觉'">
          </template>
          <template x-if="!kvOf(currentEvent) && posterOf(currentEvent)">
            <img class="dt-hero-kv" :src="posterOf(currentEvent)" :alt="currentEvent.title + ' 主视觉'">
          </template>
          <template x-if="!kvOf(currentEvent) && !posterOf(currentEvent)">
            <div class="kvx" :class="currentEvent.kvStyle" style="min-height:340px">
              <div class="kv-top"><span class="kv-type" x-text="currentEvent.categoryLabel"></span><span class="kv-no" x-text="currentEvent.sessionNo ? '第 ' + currentEvent.sessionNo + ' 期' : ''"></span></div>
              <div>
                <div class="kv-title" x-text="kvTitle(currentEvent)"></div>
                <div class="kv-meta"><span x-text="eventDateLabel(currentEvent) + ' · ' + (currentEvent.city || '')"></span></div>
                
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <section class="section compact dt-body">
      <div class="container">
        <!-- 2026-11-25 按《数创时代-案例集锦》的三栏版式重排：
             左栏 内容（主题·时间·地点 / 活动流程）+ 嘉宾（演讲嘉宾 / 在邀·拟邀嘉宾）
             中栏 活动海报（整张，不裁）
             右栏 活动照片（竖排）
             原来右侧那条黑色「活动信息」卡已删掉。 -->
        <div class="dt-cols">

          <div class="dt-main">
            <div class="dt-block">
              <div class="dt-h"><h2>内容</h2></div>
              <h3 class="dt-sub">主题 · 时间 · 地点</h3>
              <div class="dt-facts">
                <div class="row" x-show="currentEvent.theme || summaryText(currentEvent)">
                  <span class="k">活动主题</span><span class="v" x-text="themeOf(currentEvent)"></span>
                </div>
                <div class="row">
                  <span class="k">活动时间</span>
                  <span class="v" x-text="whenOf(currentEvent)"></span>
                </div>
                <div class="row">
                  <span class="k">活动地点</span>
                  <span class="v" x-text="placeOf(currentEvent)"></span>
                </div>
                <div class="row" x-show="scaleText(currentEvent)">
                  <span class="k">活动规模</span><span class="v" x-text="scaleText(currentEvent)"></span>
                </div>
                <div class="row" x-show="audienceText(currentEvent)">
                  <span class="k">参会人员</span><span class="v" x-text="audienceText(currentEvent)"></span>
                </div>
              </div>

              <h3 class="dt-sub">活动流程</h3>
              <div class="dt-flow" :class="{ 'no-time': !flowRows(currentEvent).some(function (a) { return a.time; }) }">
                <template x-for="(a, i) in flowRows(currentEvent)" :key="i">
                  <div class="item" :class="{ 'is-head': a.head }">
                    <span class="t" x-text="a.time || ''"></span>
                    <span class="x">
                      <span x-text="a.text"></span>
                      <em class="dt-flow-note" x-show="a.note" x-text="a.note"></em>
                    </span>
                  </div>
                </template>
              </div>
            </div>

            <div class="dt-block" x-show="guestsOf(currentEvent).length">
              <div class="dt-h"><h2 x-text="currentEvent.docGuestTitle || '演讲嘉宾'"></h2></div>
              <ol class="dt-guests">
                <template x-for="(g, i) in guestsOf(currentEvent)" :key="i">
                  <li><span class="n" x-text="String(i + 1).padStart(2, '0')"></span><span class="x" x-text="g"></span></li>
                </template>
              </ol>
              <p class="meta dt-note">名单与职务按活动海报与签到记录整理，仅用于活动信息展示。</p>
            </div>
          </div>

          <aside class="dt-side dt-side-poster">
            <div class="dt-h"><h2>活动海报</h2></div>
            <template x-if="posterOf(currentEvent)">
              <a class="dt-poster" :href="posterOf(currentEvent)" target="_blank" rel="noopener">
                <img :src="posterOf(currentEvent)" :alt="currentEvent.title + ' 活动海报'">
              </a>
            </template>
            <!-- 案例集锦里这些场次只放了现场照、没有海报：这一格用主视觉占位，不留白 -->
            <template x-if="!posterOf(currentEvent)">
              <div class="dt-poster dt-poster-kv">
                <div class="kvx" :class="currentEvent.kvStyle">
                  <div class="kv-top"><span class="kv-type" x-text="currentEvent.categoryLabel"></span><span class="kv-no" x-text="currentEvent.sessionNo ? '第 ' + currentEvent.sessionNo + ' 期' : ''"></span></div>
                  <div>
                    <div class="kv-title" x-text="kvTitle(currentEvent)"></div>
                    <div class="kv-meta"><span x-text="eventDateLabel(currentEvent) + ' · ' + (currentEvent.city || '')"></span></div>
                  </div>
                </div>
              </div>
            </template>
            <p class="meta dt-note" x-show="!posterOf(currentEvent)">本场未随案例集锦提供海报，先用主视觉占位。</p>
            <div class="dt-cta">
              <button class="btn gold full" @click="openRegistration(currentEvent)" x-text="eventPhaseLabel(currentEvent) === '已结束' ? '预约同类活动' : (currentEvent.type === 'elite' ? '申请席位' : '报名参会')"></button>
              <p class="meta" x-text="eventPhaseLabel(currentEvent) === '已结束' ? '本场已结束；留下联系方式，同类场次开放报名时优先通知。' : '席位有限，提交后由活动团队确认。'"></p>
            </div>
          </aside>

          <aside class="dt-side dt-side-photos">
            <div class="dt-h"><h2>活动照片</h2></div>
            <div class="dt-photo-stack" x-show="photoWall(currentEvent).length">
              <template x-for="p in photoWall(currentEvent)" :key="p">
                <a :href="p" target="_blank" rel="noopener"><img :src="p" :alt="currentEvent.title + ' 现场照片'"></a>
              </template>
            </div>
            <div class="dt-poster-empty" x-show="!photoWall(currentEvent).length">本场照片整理中</div>
          </aside>
        </div>
      </div>
    </section>

  </main>

          <label><input type="checkbox" name="consent"> 我已阅读并同意 <a href="privacy.html" target="_blank" rel="noopener">DSG 隐私条款</a>，同意 DSG 按条款处理我的信息（条款版本 <span x-text="DSGForms ? DSGForms.policyVersion : ''"></span>）</label>
          <template x-if="formState.errors.consent"><p class="field-error" x-text="formState.errors.consent"></p></template>
        </div>
        <button class="btn gold full" type="submit" :disabled="formState.submitting" x-text="formState.submitting ? '提交中…' : '提交'"></button>
        <p class="form-message full" x-show="formState.message" x-text="formState.message"></p>
      </form></div></div>

  <!-- 2026-11-25：返回箭头由本页自带脚本决定，不再依赖 site.js 版本。
       原因：旧详情页被缓存后，箭头写死 events.html，从任何入口点进来都掉回「全部活动」。
       这段脚本跟着 activity.html 一起下发，新地址不会被旧缓存命中。 -->
  <script>
  (function () {
    var back = document.querySelector(".dt-back");
    if (!back) return;
    var t = "";
    var q = new URLSearchParams(location.search || "");
    var b = q.get("back") || "";
    if (b) {
      try {
        var dec = decodeURIComponent(b);
        if (dec && !/(event-detail|activity)/.test(dec) && !/^https?:/i.test(dec)) t = dec;
      } catch (e) {}
    }
    if (!t) {
      var from = q.get("from") || "", cat = q.get("cat") || "", m = q.get("m") || "";
      var map = { home: "index", events: "events", calendar: "events-calendar",
                  summits: "events-summits", city: "events-city", elite: "events-elite-talks",
                  insights: "insights", ai: "supply-chain-ai", about: "about", contact: "contact" };
      var base = map[from];
      if (base === "index") t = "index.html";
      else if (base === "events") t = "events.html" + (cat ? "?cat=" + encodeURIComponent(cat) : (m ? "?m=" + encodeURIComponent(m) : ""));
      else if (base) t = base + ".html";
    }
    if (!t && document.referrer && document.referrer.indexOf(location.origin) === 0 &&
        !/(event-detail|activity)/.test(document.referrer)) {
      t = document.referrer.replace(location.origin + "/", "").replace(location.origin, "");
    }
    if (!t) t = "events.html";
    back.setAttribute("href", t);
    back.dataset.dtBackFixed = "1";
    back.addEventListener("click", function (ev) {
      ev.preventDefault();
      try {
        var saved = JSON.parse(sessionStorage.getItem("dsg:eventBack") || "null");
        if (saved && saved.y) sessionStorage.setItem("dsg:restoreY", String(saved.y));
      } catch (e) {}
      location.href = t;
    });
  })();
  </script>
