<body x-data="dsgApp('events')" x-init="applyCatFromUrl()">
  <header class="site-header"><nav class="nav"><a class="brand" href="index.html"><img src="assets/optimized/logo_full.webp" alt="DSG"></a><div class="nav-links"><a href="index.html">首页</a><div class="nav-item"><a class="active" href="events.html?v=20261117i">活动</a><div class="dropdown"><a href="events-calendar.html">活动日历</a><a href="events-summits.html">年度峰会</a><a href="events-city.html">城市沙龙</a><a href="events-elite-talks.html">精英六人谈</a></div></div><a href="supply-chain-ai.html">供应链AI创新专区</a><a href="consult.html">轻咨询</a><a href="insights.html">行业洞察</a><a href="about.html">关于 DSG</a></div><a class="nav-cta" href="contact.html">预约咨询</a><a class="lang-toggle" href="events-en.html">EN</a></nav></header>
  <main>
    <section class="section surface-dark ev-hero">
      <div class="container split">
        <div class="ev-hero-copy">
          <span class="eyebrow">Events</span>
          <h1>从一场峰会 · 到一桌深谈</h1>
          <p class="muted"><span class="nw">年度峰会</span>见行业趋势，<span class="nw">城市沙龙</span>把议题落到区域产业带，<span class="nw">精英六人谈</span>拆解具体问题。</p>
          <div class="evf-flags">
            <template x-for="c in visibleCategories" :key="c.key">
              <a class="pill" href="#calendar" @click="typeFilter = c.key" x-text="c.count ? c.label + ' ' + c.count + ' 场' : c.label"></a>
            </template>
          </div>
        </div>
        <div class="media-frame"><img src="assets/optimized/module-events-v2.webp" alt="DSG 活动现场"></div>
      </div>
    </section>

    <section class="section compact surface-white">
      <div class="container">
        <div class="st-band on-light">
          <template x-for="item in homeMetrics" :key="item.label">
            <div class="st-item">
              <span class="st-num"><span x-text="metricText(item.metric)"></span><em class="u" x-text="item.unit"></em></span>
              <span class="st-lab" x-text="item.label"></span>
            </div>
          </template>
        </div>

        <!-- 三类活动：从原「三类活动，按规模区分」区块搬到数字带下方，去掉标题与说明，
             只留三张客观上带计数的卡片；点击即切到下方对应的筛选视图。 -->
        <div class="cat-overview ev-cats">
          <template x-for="(c, i) in eventCategories" :key="c.key">
            <a class="ov-card" href="#calendar" @click="typeFilter = c.key">
              <div class="ov-top">
                <span class="ov-no" x-text="i + 1 < 10 ? '0' + (i + 1) : '' + (i + 1)"></span>
                <h3 x-text="c.label"></h3>
              </div>
              <div class="ov-num"><b x-text="c.count || '按需'"></b><span x-show="c.count" x-text="'场'"></span></div>
              <p class="ov-desc" x-text="c.desc"></p>
              <div class="ov-last" x-text="latestCategoryEvent(c.key)"></div>
            </a>
          </template>
        </div>
      </div>
    </section>

    <section class="section compact" id="calendar">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Calendar</span>
            <h2>活动日历</h2>
          </div>
        </div>

        <!-- 筛选：全部活动 / 年度峰会 / 城市沙龙 / 精英六人谈。
             点哪一个就只显示哪一类，类型内容不再在下面层层堆叠。 -->
        <div class="filters ev-filters">
          <button class="filter" :class="{active: typeFilter === 'all'}" @click="typeFilter = 'all'">全部活动</button>
          <button class="filter" :class="{active: typeFilter === 'summit'}" @click="typeFilter = 'summit'">年度峰会</button>
          <button class="filter" :class="{active: typeFilter === 'city'}" @click="typeFilter = 'city'">城市沙龙</button>
          <button class="filter" :class="{active: typeFilter === 'elite'}" @click="typeFilter = 'elite'">精英六人谈</button>
        </div>

        <!-- 全部活动：月历。按系统日历的排法——周一起第一列，含前后月补格，
             右上角直接选年选月，不再用「2026/2025/2024」三个并列页签。 -->
        <div class="syscal" x-show="typeFilter === 'all'">
          <div class="syscal-bar">
            <h3 x-text="calYear + ' 年 ' + calMonth + ' 月'"></h3>
            <div class="syscal-pick">
              <select :value="calYear" x-init="$nextTick(function () { $el.value = calYear })" @change="setCalYear($event.target.value)" aria-label="选择年份">
                <template x-for="y in calYears" :key="y">
                  <option :value="y" x-text="y + ' 年'"></option>
                </template>
              </select>
              <select :value="calMonth" x-init="$nextTick(function () { $el.value = calMonth })" @change="setCalMonth($event.target.value)" aria-label="选择月份">
                <template x-for="m in 12" :key="m">
                  <option :value="m" x-text="m + ' 月'"></option>
                </template>
              </select>
              <div class="syscal-nav">
                <button type="button" @click="changeMonth(-1)" aria-label="上个月">‹</button>
                <button type="button" @click="changeMonth(1)" aria-label="下个月">›</button>
              </div>
            </div>
          </div>
          <div class="syscal-week">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div class="syscal-grid">
            <template x-for="cell in calCells" :key="cell.key">
              <div class="syscal-cell" :class="{ outside: cell.outside, today: cell.today }">
                <span class="sc-day" x-text="cell.day"></span>
                <div class="sc-evs">
                  <template x-for="e in cell.events.slice(0, 2)" :key="e.id">
                    <a class="sc-ev" :class="e.category" :href="eventDetailUrl(e)" :title="e.title">
                      <span x-text="e.title"></span>
                    </a>
                  </template>
                  <span class="sc-more" x-show="cell.events.length > 2" x-text="'+' + (cell.events.length - 2)"></span>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- 单类视图：点击筛选后只显示这一类。标题只留「类型名 + 场次数」，下面不再挂说明小字。 -->
        <div class="cat-block ev-cat-view" x-show="typeFilter !== 'all'" x-cloak>
          <div class="cat-head">
            <div class="cat-title">
              <h2 x-text="activeCategory ? activeCategory.label : ''"></h2>
              <span class="cat-count" x-text="activeCategory && activeCategory.count ? activeCategory.count + ' 场' : ''"></span>
            </div>
          </div>

          <!-- 年度峰会：两届大会各一张卡。标题固定一行；议程统一成「日期 / 时段 / 内容」三列；
               嘉宾只写人数，不再挂头像排。 -->
          <template x-if="typeFilter === 'summit'">
            <div class="cat-cards two">
              <template x-for="e in activeCategoryEvents" :key="e.id">
                <article class="evc">
                  <div class="evc-media">
                    <span class="evc-tag" x-text="e.categoryLabel + (e.sessionNo ? ' · 第 ' + e.sessionNo + ' 期' : '')"></span>
                    <template x-if="hasMedia(e)">
                      <img :src="e.image" :alt="e.title">
                    </template>
                    <template x-if="!hasMedia(e)">
                      <div class="kvx" :class="e.kvStyle">
                        <div class="kv-top"><span class="kv-type" x-text="e.categoryLabel"></span><span class="kv-no" x-text="e.sessionNo ? '第 ' + e.sessionNo + ' 期' : ''"></span></div>
                        <div>
                          <div class="kv-title" x-text="kvTitle(e)"></div>
                          <div class="kv-meta"><span x-text="eventDateLabel(e) + ' · ' + (e.city || '')"></span></div>
                        </div>
                      </div>
                    </template>
                  </div>
                  <div class="evc-body">
                    <div class="evc-meta">
                      <span x-text="eventDateLabel(e)"></span>
                      <span x-text="e.city"></span>
                      <span x-text="scaleText(e)"></span>
                    </div>
                    <h3 x-text="e.title"></h3>
                    <ul class="evc-plan">
                      <template x-for="(a, i) in summitAgenda(e)" :key="'p' + i">
                        <li>
                          <span class="p-date" x-text="a.date"></span>
                          <span class="p-tag" x-text="a.tag"></span>
                          <span class="p-text" x-text="a.text"></span>
                        </li>
                      </template>
                    </ul>
                    <div class="evc-fact">
                      <span class="k">嘉宾人数：</span>
                      <span class="v"><b x-text="speakerCountOf(e)"></b> 人</span>
                    </div>
                    <div class="evc-foot">
                      <span class="meta" x-text="audienceText(e)"></span>
                      <a class="btn secondary" :href="eventDetailUrl(e)">查看详情</a>
                    </div>
                  </div>
                </article>
              </template>
            </div>
          </template>

          <!-- 城市沙龙 / 精英六人谈：链接式逐条列表（一行一场），上方搜索、下方分页 -->
          <template x-if="typeFilter === 'city' || typeFilter === 'elite'">
            <div class="ev-browser">
              <template x-for="k in [typeFilter]" :key="k">
                <div>
                  <div class="ev-search">
                    <svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.6"></circle><path d="M12.8 12.8 17 17" stroke-linecap="round"></path></svg>
                    <input type="search" :placeholder="k === 'elite' ? '搜索期号、城市或主题关键词' : '搜索城市或主题关键词'" :value="listQuery[k]" @input="setQuery(k, $event.target.value)">
                    <button class="clr" type="button" x-show="listQuery[k]" @click="setQuery(k, '')" aria-label="清空搜索">×</button>
                  </div>
                  <p class="ev-search-note" x-show="queryOf(k)" x-text="'「' + queryOf(k) + '」匹配到 ' + listTotal(k) + ' 场'"></p>

                  <div class="ev-list">
                    <template x-for="e in pageRows(k)" :key="e.id">
                      <a class="ev-row" :class="k" :href="eventDetailUrl(e)">
                        <span class="ev-row-no" x-show="k === 'elite'" x-text="e.sessionNo ? '第 ' + e.sessionNo + ' 期' : '专场'"></span>
                        <span class="ev-row-date" x-text="eventDateLabel(e)"></span>
                        <span class="ev-row-city" x-text="e.city || ''"></span>
                        <span class="ev-row-title" x-text="e.title"></span>
                        <span class="ev-row-go">›</span>
                      </a>
                    </template>
                  </div>
                  <p class="ev-empty" x-show="!listTotal(k)">没有匹配的场次，换个关键词试试。</p>

                  <div class="ev-pager">
                    <div class="ev-pages">
                      <button class="ev-pg-nav" type="button" @click="setPage(k, currentPage(k) - 1)" :disabled="currentPage(k) <= 1" aria-label="上一页">‹</button>
                      <template x-for="(p, pi) in pageNumbers(k)" :key="'pg' + pi">
                        <span>
                          <span class="ev-pg-dots" x-show="p === '…'">…</span>
                          <button class="ev-pg" type="button" x-show="p !== '…'" :class="{ active: p === currentPage(k) }" @click="setPage(k, p)" x-text="p"></button>
                        </span>
                      </template>
                      <button class="ev-pg-nav" type="button" @click="setPage(k, currentPage(k) + 1)" :disabled="currentPage(k) >= pageCount(k)" aria-label="下一页">›</button>
                    </div>
                    <div class="ev-pager-meta">
                      <label class="ev-size">
                        <select :value="listSize[k]" x-init="$nextTick(function () { $el.value = listSize[k] })" @change="setSize(k, $event.target.value)" aria-label="每页条数">
                          <template x-for="n in [10, 20, 30, 40, 50]" :key="n">
                            <option :value="n" x-text="n + ' 条/页'"></option>
                          </template>
                        </select>
                      </label>
                      <label class="ev-jump">
                        第
                        <input type="text" inputmode="numeric" :value="currentPage(k)" @keydown.enter.prevent="jumpPage(k, $event.target.value)" @blur="jumpPage(k, $event.target.value)" aria-label="跳转到第几页">
                        / <b x-text="pageCount(k)"></b> 页
                      </label>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

</div>
  </div></footer>
  <div class="modal" x-cloak x-show="selectedEvent"><div class="modal-panel"><div class="modal-head"><div><div class="meta" x-text="selectedEvent && selectedEvent.eyebrow"></div><h2 x-text="selectedEvent && selectedEvent.title"></h2></div><button class="close" @click="closeRegistration()">×</button></div><form class="form-grid lead-form" novalidate @submit.prevent="submitRegistration($event)" @focusin.once="$el.elements.formStartedAt.value = Date.now()">
        <input type="hidden" name="formStartedAt" value="">
        <div class="hp" aria-hidden="true"><label>website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <div class="field"><input name="name" placeholder="姓名" autocomplete="name" required><template x-if="formState.errors.name"><p class="field-error" x-text="formState.errors.name"></p></template></div>
        <div class="field"><input name="company" placeholder="公司" autocomplete="organization" required><template x-if="formState.errors.company"><p class="field-error" x-text="formState.errors.company"></p></template></div>
        <div class="field"><input name="jobTitle" placeholder="职位" autocomplete="organization-title"></div>
        <div class="field"><input name="phone" placeholder="手机" inputmode="tel" autocomplete="tel" required><template x-if="formState.errors.phone"><p class="field-error" x-text="formState.errors.phone"></p></template></div>
        <div class="field full"><input name="email" type="email" placeholder="邮箱" autocomplete="email" required><template x-if="formState.errors.email"><p class="field-error" x-text="formState.errors.email"></p></template></div>
        <div class="field full"><select name="interest"><option>我想报名参会</option><option>我想申请私董会席位</option><option>我想预约供应链 AI Demo</option><option>我想了解商务合作</option><option>我想了解后续场次</option></select></div>
        <div class="field full"><textarea name="message" placeholder="希望交流的问题"></textarea></div>
        <div class="field full form-consent">
          <label><input type="checkbox" name="consent"> 我已阅读并同意 <a href="privacy.html" target="_blank" rel="noopener">DSG 隐私条款</a>，同意 DSG 按条款处理我的信息（条款版本 <span x-text="DSGForms ? DSGForms.policyVersion : ''"></span>）</label>
          <template x-if="formState.errors.consent"><p class="field-error" x-text="formState.errors.consent"></p></template>
        </div>
        <button class="btn gold full" type="submit" :disabled="formState.submitting" x-text="formState.submitting ? '提交中…' : '提交'"></button>
        <p class="form-message full" x-show="formState.message" x-text="formState.message"></p>
      </form></div></div>
<script src="assets/dsg-sync.js?v=20260917-eventsync"></script>
</body>
