<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/optimized/logo_favicon.png">
  <title>DSG 管理后台</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="DSG 官网内容管理后台，仅限授权人员使用。">
  <link rel="stylesheet" href="assets/admin.css?v=20261126b">
  <script defer src="assets/alpine.min.js"></script>
  <script src="assets/forms.js?v=20260917-eventsync"></script>
  <script src="assets/embedded-data.js?v=20261120d"></script>
  <script src="assets/theme.js?v=20261119a"></script>
  <script src="assets/admin.js?v=20261126c"></script>
</head>
<body x-data="dsgAdmin()" x-init="init()">
  <template x-if="!session.active">
    <main class="login-shell">
      <section class="login-panel">
        <div>
          <img src="assets/optimized/logo_full.webp" alt="DSG" class="login-logo">
          <span class="eyebrow">Admin Console</span>
          <h1>DSG 网站内容管理后台</h1>
          <p>当前为 JSON 版本的管理界面原型，先用于配置模块权限、维护会议、供应链AI创新专区和行业洞察内容。</p>
        </div>
        <form class="login-form" @submit.prevent="login()">
          <label>登录角色</label>
          <select x-model="loginRole">
            <template x-for="role in roles" :key="role.id">
              <option :value="role.id" x-text="role.name + '（' + (role.scope || '') + '）'"></option>
            </template>
          </select>
          <label>登录密码</label>
          <input type="password" x-model="password" placeholder="请输入密码" required>
          <button class="primary">进入后台</button>
          <p class="login-error" x-show="loginError" x-text="loginError" style="color:#c0392b;font-size:13px;margin-top:8px;"></p>
          <p class="hint">演示账号：admin / DSG2026（密码错误无法进入）</p>
        </form>
      </section>
    </main>
  </template>

  <template x-if="session.active">
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="admin-brand">
          <img src="assets/optimized/logo_full.webp" alt="DSG">
          <div><strong>管理后台</strong><span x-text="currentRole.name"></span></div>
        </div>
        <nav>
          <button :class="{active: activeModule==='dashboard'}" @click="activeModule='dashboard'">总览</button>
          <template x-for="m in navModules" :key="m.id">
            <button :class="{active: activeModule===m.id}" @click="activeModule=m.id">
              <span x-text="m.label"></span>
            </button>
          </template>
        </nav>
        <div class="sidebar-foot">
          <button class="ghost" @click="resetDrafts()">重置草稿</button>
          <button class="ghost" @click="logout()">退出</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <span class="eyebrow">DSG Content Operations</span>
            <h1 x-text="moduleTitle"></h1>
          </div>
          <div class="top-actions">
            <div class="undo-group">
              <button type="button" class="icon-btn" @click="undo()" :disabled="!canUndo"
                      :title="canUndo ? '撤销：' + undoLabel : '没有可撤销的操作'">↶</button>
              <button type="button" class="icon-btn" @click="redo()" :disabled="!canRedo"
                      :title="canRedo ? '重做：' + redoLabel : '没有可重做的操作'">↷</button>
            </div>
            <span class="publish-mode" :class="publish.mode" x-text="publishModeLabel"></span>
            <span class="save-state" :title="saveState" x-text="saveState"></span>
            <button class="secondary mini" x-show="publish.mode!=='local'" @click="loginOpen = !loginOpen"
                    x-text="ghLogin ? ('账号 ' + ghLogin) : '登录'"></button>
            <button class="primary" @click="publishToFrontend()" :disabled="publish.busy" x-text="publish.busy ? '发布中…' : '发布上线'"></button>
            <button class="secondary" @click="exportCurrent()">导出当前模块 JSON</button>
            <a class="secondary link" href="index.html" target="_blank">查看前台</a>
          </div>
        </header>

        <!-- 发布失败：顶栏那句会被截断，这里给完整原因 + 该怎么做 -->
        <section class="notice publish-notice" x-show="publish.error">
          <div>
            <b>发布没走通，线上没有任何改动</b>
            <p class="diag-text" x-text="publish.error"></p>
          </div>
          <div class="diag-actions">
            <button class="secondary mini" type="button" @click="copyDiag()">复制诊断</button>
            <button class="secondary mini" type="button" @click="publish.error=''">知道了</button>
          </div>
        </section>

        <!-- 登录发布账号：谁用谁登录，跟用哪台电脑无关 -->
        <section class="notice login-panel" x-show="showLoginPanel">
          <div class="login-body">
            <b x-show="ghLogin">
              <span x-text="'已登录：' + ghLogin"></span>
              <span class="login-state">可发布</span>
            </b>
            <b x-show="!ghLogin">登录后才能发布到线上</b>
            <p class="hint" x-show="!ghLogin">粘一次你自己的 GitHub 访问令牌，这台电脑就记住；换电脑、换同事，各登各的，不影响别人。改动在登录前后都不会丢。</p>
            <div class="login-row" x-show="!ghLogin">
              <input type="password" x-model="tokenInput" placeholder="粘贴 GitHub 访问令牌（github_pat_… 或 ghp_…）"
                     @keydown.enter="loginWithToken()">
              <button class="primary" type="button" @click="loginWithToken()" :disabled="tokenBusy"
                      x-text="tokenBusy ? '验证中…' : '登录'"></button>
            </div>
            <p class="login-error" x-show="loginError" x-text="loginError"></p>
          </div>
          <div class="diag-actions">
            <button class="secondary mini" type="button" x-show="ghLogin" @click="logoutToken()">退出登录</button>
            <button class="secondary mini" type="button" x-show="loginOpen && !ghLogin" @click="loginOpen=false">收起</button>
          </div>
        </section>

        <section class="notice" x-show="dataError">
          数据文件读取失败，当前显示本地草稿或空数据。请检查 JSON 文件路径。
        </section>

        <section x-show="activeModule==='dashboard'" class="dashboard-grid">
          <article class="metric-card"><span>会议活动</span><strong x-text="draft.events.length"></strong><p>年度峰会、城市沙龙、精英六人谈</p></article>
          <article class="metric-card"><span>AI 案例</span><strong x-text="draft.aiCases.length"></strong><p>供应链AI创新专区案例卡片</p></article>
          <article class="metric-card"><span>行业洞察</span><strong x-text="draft.insights.length"></strong><p>文章、视频回放、闭门纪要</p></article>
          <article class="metric-card"><span>角色</span><strong x-text="roles.length"></strong><p>当前可配置的后台权限角色</p></article>
          <div class="wide-panel req-panel" x-show="requirementGroups.length">
            <div class="panel-head">
              <h2>改版要求 · 以 11-17 评审为准</h2>
              <span class="muted" x-text="requirements && requirements.source ? '核对于 ' + requirements.source.updatedAt : ''"></span>
            </div>
            <div class="req-stats">
              <span class="req-chip done"><b x-text="requirementStats.done"></b>已落实</span>
              <span class="req-chip partial"><b x-text="requirementStats.partial"></b>部分</span>
              <span class="req-chip todo"><b x-text="requirementStats.todo"></b>未落实</span>
              <span class="req-chip"><b x-text="requirementStats.total"></b>合计</span>
            </div>
            <template x-for="g in requirementGroups" :key="g.id">
              <div class="req-group">
                <h3 x-text="g.name"></h3>
                <template x-for="i in g.items" :key="i.id">
                  <div class="req-row" :class="i.status">
                    <em x-text="reqStatusLabel(i.status)"></em>
                    <div>
                      <p class="req-text" x-text="i.text"></p>
                      <p class="req-note" x-text="i.note" x-show="i.note"></p>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
          <div class="wide-panel">
            <h2>当前权限</h2>
            <div class="permission-pills">
              <template x-for="module in modules" :key="module.id">
                <span :class="{off: !can(module.id)}"><b x-text="module.name"></b><em x-text="can(module.id) ? '已授权' : '无权限'"></em></span>
              </template>
            </div>
          </div>
          <div class="wide-panel">
            <h2>发布通道</h2>
            <p class="hint" x-show="publish.mode==='local'">本机直连：点「发布上线」会改写内容文件、提交并推送，程序核对远端与本地一致后才提示成功，约 1 分钟全网可见。</p>
            <p class="hint" x-show="publish.mode!=='local' && ghLogin">已用 <b x-text="ghLogin"></b> 登录：点「发布上线」直接写回线上仓库，任何电脑都一样。顶栏「账号」可以换人或退出。</p>
            <p class="hint" x-show="publish.mode!=='local' && !ghLogin">还没登录发布账号。点顶栏「登录」，粘一次自己的 GitHub 令牌即可；不装软件、不绑设备。</p>
            <div class="form-grid">
              <label class="full">发布说明（写进提交记录）
                <input x-model="publishMessage" placeholder="如：更新 12 月城市沙龙">
              </label>
            </div>
            <p class="hint" x-show="publish.commit">最近一次发布：<b x-text="publish.commit"></b><span x-text="publish.at ? ' · ' + publish.at : ''"></span></p>
          </div>
        </section>

        <!-- ================= 导航菜单（一级 / 二级） ================= -->
        <section x-show="activeModule==='navigation'" class="manager-layout">
          <div class="tool-panel">
            <div class="panel-head">
              <h2>顶部导航</h2>
              <button class="primary" type="button" @click="navAdd()">新增一级菜单</button>
            </div>
            <template x-if="nav.data">
              <div class="nav-editor">
                <template x-for="(item, idx) in nav.data.items" :key="item.id">
                  <div class="nav-row" :class="{off: !item.visible}">
                    <div class="nav-row-main">
                      <input class="nav-label" :value="item.label"
                             @change="item.label = $event.target.value; persistNav('修改菜单文字：' + item.label)" placeholder="菜单文字">
                      <input class="nav-href" :value="item.href"
                             @change="item.href = $event.target.value; persistNav('修改菜单跳转：' + item.label)" placeholder="index.html">
                      <div class="nav-row-actions">
                        <button type="button" class="mini" @click="navMove(item)" :disabled="idx===0" title="上移">↑</button>
                        <button type="button" class="mini" @click="navMoveDown(item)" :disabled="idx===nav.data.items.length-1" title="下移">↓</button>
                        <button type="button" class="mini" @click="navToggle(item)" x-text="item.visible ? '显示中' : '已隐藏'"></button>
                        <button type="button" class="mini danger" @click="navRemove(item, false, null)">删除</button>
                      </div>
                    </div>
                    <div class="nav-children" x-show="item.children && item.children.length">
                      <template x-for="child in (item.children || [])" :key="child.id">
                        <div class="nav-child" :class="{off: !child.visible}">
                          <input :value="child.label" @change="child.label = $event.target.value; persistNav('修改二级菜单文字')" placeholder="二级菜单文字">
                          <input :value="child.href" @change="child.href = $event.target.value; persistNav('修改二级菜单跳转')" placeholder="events-city.html">
                          <button type="button" class="mini" @click="child.visible = !child.visible; persistNav('切换二级菜单显示')" x-text="child.visible ? '显示中' : '已隐藏'"></button>
                          <button type="button" class="mini danger" @click="navRemove(child, true, item)">删除</button>
                        </div>
                      </template>
                    </div>
                    <button type="button" class="mini add" @click="navAddChild(item)">+ 加二级菜单</button>
                  </div>
                </template>
              </div>
            </template>
          </div>
          <div class="editor-panel">
            <div class="panel-head">
              <h2>导航全局设置</h2>
              <button class="secondary" type="button" @click="navReset()">恢复线上</button>
            </div>
            <template x-if="nav.data">
              <div class="form-grid">
                <label class="full">菜单样式
                  <select :value="nav.data.navStyle" @change="navStyleSet($event.target.value)">
                    <option value="text">文字菜单（当前线上）</option>
                    <option value="button">按钮式菜单</option>
                  </select>
                </label>
                <label class="full">EN 切换按钮
                  <select :value="String(nav.data.showLangSwitch)"
                          @change="nav.data.showLangSwitch = ($event.target.value === 'true'); persistNav('切换 EN 按钮')">
                    <option value="true">显示（当前线上）</option>
                    <option value="false">隐藏，只保留中文</option>
                  </select>
                </label>
                <label>「预约咨询」文字
                  <input :value="nav.data.cta.label" @change="nav.data.cta.label = $event.target.value; persistNav('修改预约咨询按钮文字')">
                </label>
                <label>「预约咨询」跳转
                  <input :value="nav.data.cta.href" @change="nav.data.cta.href = $event.target.value; persistNav('修改预约咨询按钮链接')">
                </label>
                <label class="full">导航字体与字号
                  <input value="固定：14px / 500 字重，随屏宽自适应" disabled>
                </label>
              </div>
            </template>
          </div>
        </section>

        <!-- ================= 板块管理 ================= -->
        <section x-show="activeModule==='blocks'" class="manager-layout">
          <div class="tool-panel">
            <div class="panel-head"><h2>页面板块</h2></div>
            <div class="table-list">
              <template x-for="pg in cfgPages" :key="pg.key">
                <button class="row-item" :class="{active: cfg.page===pg.key}"
                        @click="cfg.page = pg.key; cfg.selectedId = null">
                  <span><strong x-text="pg.label"></strong><small x-text="pg.file"></small></span>
                </button>
              </template>
            </div>
            <div class="metric-editor" x-show="cfg.page==='home'">
              <div class="panel-head metric-head">
                <h2>首页数字带（5 格）</h2>
                <button class="secondary mini" type="button" @click="siteReset()">恢复线上</button>
              </div>
              <template x-for="(m, i) in homeMetrics" :key="i">
                <div class="metric-row">
                  <input :value="m.label" @change="setMetric(i, 'label', $event.target.value)" placeholder="名称">
                  <input type="number" :value="m.metric && m.metric.value" @change="setMetric(i, 'value', $event.target.value)" placeholder="数值">
                  <input :value="m.unit" @change="setMetric(i, 'unit', $event.target.value)" placeholder="单位">
                  <input :value="m.metric && m.metric.display" @change="setMetric(i, 'display', $event.target.value)" placeholder="可留空">
                  <small x-text="metricSource(i)"></small>
                </div>
              </template>
            </div>
            <div class="hint" x-show="cfgDeleted.length">
              已删除但还能恢复的板块：
              <template x-for="b in cfgDeleted" :key="b.id">
                <span><b x-text="b.name"></b><button type="button" class="mini" @click="cfgRestore(b)">恢复</button></span>
              </template>
            </div>
          </div>
          <div class="editor-panel">
            <div class="panel-head">
              <h2 x-text="'板块顺序：' + (cfgPage ? cfgPage.label : '')"></h2>
              <div>
                <button class="secondary" type="button" @click="cfgReset()">恢复线上</button>
                <a class="secondary link" :href="cfgPage ? cfgPage.file : 'index.html'" target="_blank">看前台</a>
              </div>
            </div>
            <template x-if="cfgPage">
              <div>
                <div class="blk-list">
                  <template x-for="(b, i) in cfgSections" :key="b.id">
                    <div class="blk-row" :class="{off: !b.visible, active: cfg.selectedId===b.id}">
                      <span class="blk-idx" x-text="i + 1"></span>
                      <div class="blk-name">
                        <strong x-text="b.name"></strong>
                        <small x-text="b.type + (b.custom ? ' · 新增板块' : ' · 原有板块')"></small>
                      </div>
                      <div class="blk-actions">
                        <button type="button" class="mini" @click="cfgMove(b,-1)" :disabled="i===0" title="上移">↑</button>
                        <button type="button" class="mini" @click="cfgMove(b,1)" :disabled="i===cfgSections.length-1" title="下移">↓</button>
                        <button type="button" class="mini" @click="cfgToggle(b)" x-text="b.visible ? '显示中' : '已隐藏'"></button>
                        <button type="button" class="mini" @click="cfgSelect(b.id)">设置</button>
                        <button type="button" class="mini danger" @click="cfgRemove(b)">删除</button>
                      </div>
                    </div>
                  </template>
                </div>
                <div class="actions">
                  <span class="muted">新增板块：</span>
                  <template x-for="t in blockTypeOptions" :key="t.value">
                    <button type="button" class="mini add" @click="cfgAdd(t.value)" x-text="'+ ' + t.label"></button>
                  </template>
                </div>
                <template x-if="cfgSelected">
                  <div class="blk-editor">
                    <h3 x-text="'正在设置：' + cfgSelected.name"></h3>
                    <div class="form-grid">
                      <label>板块名称（只在后台显示）
                        <input :value="cfgSelected.name" @change="cfgRename(cfgSelected, $event.target.value)">
                      </label>
                      <label>字号
                        <select :value="(cfgSelected.style || {}).fontScale"
                                @change="cfgSetStyle(cfgSelected, 'fontScale', $event.target.value)">
                          <template x-for="o in fontScaleOptions" :key="o.value">
                            <option :value="o.value" x-text="o.label"></option>
                          </template>
                        </select>
                      </label>
                      <label>文字颜色
                        <select :value="(cfgSelected.style || {}).themeColor"
                                @change="cfgSetStyle(cfgSelected, 'themeColor', $event.target.value)">
                          <template x-for="o in themeColorOptions" :key="o.value">
                            <option :value="o.value" x-text="o.label"></option>
                          </template>
                        </select>
                      </label>
                      <label>对齐
                        <select :value="(cfgSelected.style || {}).align"
                                @change="cfgSetStyle(cfgSelected, 'align', $event.target.value)">
                          <option value="left">左对齐</option>
                          <option value="center">居中</option>
                        </select>
                      </label>
                      <label class="full">背景图
                        <input :value="(cfgSelected.style || {}).bgImage"
                               @change="cfgSetStyle(cfgSelected, 'bgImage', $event.target.value)"
                               placeholder="assets/photos/… 留空则沿用原背景">
                        <button type="button" class="secondary upload-btn" @click="pickBlockImage()">上传背景图</button>
                      </label>
                    </div>
                    <template x-if="cfgSelected.custom">
                      <div class="form-grid">
                        <label class="full">眉标
                          <input :value="(cfgSelected.content || {}).eyebrow"
                                 @change="cfgSetContent(cfgSelected, 'eyebrow', $event.target.value)" placeholder="可留空">
                        </label>
                        <label class="full">标题
                          <input :value="(cfgSelected.content || {}).title"
                                 @change="cfgSetContent(cfgSelected, 'title', $event.target.value)">
                        </label>
                        <label class="full">正文
                          <textarea rows="4" :value="(cfgSelected.content || {}).body"
                                    @change="cfgSetContent(cfgSelected, 'body', $event.target.value)"></textarea>
                        </label>
                        <label>按钮文字
                          <input :value="(cfgSelected.content || {}).buttonLabel"
                                 @change="cfgSetContent(cfgSelected, 'buttonLabel', $event.target.value)" placeholder="留空则不显示按钮">
                        </label>
                        <label>按钮跳转
                          <input :value="(cfgSelected.content || {}).buttonHref"
                                 @change="cfgSetContent(cfgSelected, 'buttonHref', $event.target.value)">
                        </label>
                        <label class="full">图片
                          <input :value="(cfgSelected.content || {}).image"
                                 @change="cfgSetContent(cfgSelected, 'image', $event.target.value)" placeholder="assets/photos/…">
                        </label>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </section>

        <!-- ================= 版本历史与操作日志 ================= -->
        <section x-show="activeModule==='history'" class="manager-layout">
          <div class="tool-panel">
            <div class="panel-head">
              <h2>撤销与重做</h2>
              <button class="secondary" type="button" @click="clearUndo()">清空记录</button>
            </div>
            <div class="undo-big">
              <button class="secondary" type="button" @click="undo()" :disabled="!canUndo">
                ↶ 撤销<span x-show="canUndo" x-text="'：' + undoLabel"></span>
              </button>
              <button class="secondary" type="button" @click="redo()" :disabled="!canRedo">
                ↷ 重做<span x-show="canRedo" x-text="'：' + redoLabel"></span>
              </button>
            </div>
            <p class="muted" x-text="'可撤销 ' + undoStack.length + ' 步 · 可重做 ' + redoStack.length + ' 步'"></p>
          </div>
          <div class="editor-panel">
            <div class="panel-head">
              <h2>历史与留痕</h2>
              <button class="secondary" type="button" @click="loadHistory()">刷新</button>
            </div>
            <div class="lang-switch">
              <button type="button" :class="{on: history.tab==='ops'}" @click="history.tab='ops'">操作日志</button>
              <button type="button" :class="{on: history.tab==='rev'}" @click="history.tab='rev'">已发布版本</button>
            </div>
            <div x-show="history.tab==='ops'">
              <div class="hist-list">
                <template x-for="(o, i) in history.ops" :key="i">
                  <div class="hist-row">
                    <em x-text="o.action"></em>

                    </template>
                    <td class="perm-count"><b x-text="grantCount(role)"></b><span x-text="' / ' + modules.length"></span></td>
                    <td class="scope" x-text="role.scope || '自定义角色，可自由勾选模块'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="tool-panel">
            <div class="panel-head"><h2>角色</h2><button class="primary" @click="newRole()">新增角色</button></div>
            <div class="table-list">
              <template x-for="role in roles" :key="role.id">
                <button class="row-item" :class="{active: selected.role && selected.role.id===role.id}" @click="editRole(role)">
                  <span><strong x-text="role.name"></strong><small x-text="role.id"></small></span>
                </button>
              </template>
            </div>
          </div>
          <template x-if="selected.role">
          <form class="editor-panel" @submit.prevent="saveRole()">
            <div class="panel-head"><h2>模块授权</h2><button class="danger" type="button" @click="deleteRole()" :disabled="selected.role.id==='super-admin'">删除</button></div>
            <div class="form-grid">
              <label>角色名称<input x-model="selected.role.name" required></label>
              <label>角色 ID<input x-model="selected.role.id" :disabled="selected.role.locked"></label>
            </div>
            <div class="permission-list" :class="{readonly: selected.role.locked}">
              <template x-for="module in modules" :key="module.id">
                <label><input type="checkbox" :value="module.id" x-model="selected.role.permissions" :disabled="selected.role.locked"> <span x-text="module.name"></span></label>
              </template>
            </div>
            <label>职责范围<input x-model="selected.role.scope" placeholder="如：供应链AI创新专区 + 线索管理" :disabled="selected.role.locked"></label>
            <button class="primary" :disabled="selected.role.locked">保存权限配置</button>
          </form>
          </template>
        </section>

        <!-- 线索管理：受限数据，仅授权角色可见，导出需留痕 -->
        <section x-show="activeModule==='leads'" class="manager-layout">
          <div class="tool-panel">
            <div class="panel-head"><h2>线索队列</h2><button class="primary" @click="refreshLeads()">刷新</button></div>
            <p class="muted">线索属于受限数据，导出后请按公司数据安全规范处理，不得转发到个人设备或公开渠道。</p>
            <div class="filters"><input x-model="filters.leads" placeholder="搜索姓名、公司、邮箱"></div>
            <div class="table-list">
              <template x-for="lead in filteredLeads" :key="lead.id">
                <div class="row-item static">
                  <span><strong x-text="lead.name + ' · ' + lead.company"></strong><small x-text="lead.createdAt + ' · ' + lead.type + ' · ' + lead.phone"></small></span>
                  <em x-text="lead.status"></em>
                </div>
              </template>
              <p class="muted" x-show="!filteredLeads.length">暂无线索。前台表单提交后会进入此队列。</p>
            </div>
            <div class="actions">
              <button class="primary" @click="exportLeads()" :disabled="!leads.length">导出 CSV</button>
              <button class="danger" type="button" @click="clearLeads()" :disabled="!leads.length">清空队列</button>
            </div>
          </div>
          <div class="editor-panel">
            <div class="panel-head"><h2>投递通道</h2></div>
            <p>当前通道：<strong x-text="DSGForms ? DSGForms.policyVersion : ''"></strong> 条款版本</p>
            <p class="muted">可选通道：<span x-text="DSGForms ? DSGForms.channels.join(' / ') : ''"></span></p>
            <p class="muted">修改通道请编辑 assets/form-config.js（该文件不入库），webhook 失败时线索会自动降级保存到本地队列。</p>
          </div>
        </section>
      </main>
    </div>
  </template>
</body>
</html>
